<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Comedouro (componente)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 100%; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; color: #2b2420">
<svg viewBox="0 0 200 240" style="width: 100%; height: auto; display: block" role="img" aria-label="{{aria}}">
<defs>
<pattern id="sementes" width="8" height="8" patternUnits="userSpaceOnUse">
<circle cx="2" cy="2" r="1.3" fill="#b9832f"></circle>
<circle cx="6" cy="6" r="1.3" fill="#b9832f"></circle>
</pattern>
</defs>
<rect x="62" y="8" width="56" height="18" rx="3" fill="#3d6fa8"></rect>
<circle cx="76" cy="17" r="6.5" fill="#dfe5ea" stroke="#2b2420" stroke-width="0.8"></circle>
<circle cx="104" cy="17" r="6.5" fill="#dfe5ea" stroke="#2b2420" stroke-width="0.8"></circle>
<rect x="44" y="26" width="92" height="6" rx="2" fill="#7a6e66"></rect>
<rect x="48" y="32" width="84" height="124" rx="8" fill="#fbf8f4" stroke="#7a6e66" stroke-width="1.5"></rect>
<rect x="52" y="{{sy}}" width="76" height="{{sh}}" rx="5" fill="#d6a24a"></rect>
<rect x="52" y="{{sy}}" width="76" height="{{sh}}" rx="5" fill="url(#sementes)"></rect>
<path d="M52 156 L84 182 L96 182 L128 156 Z" fill="#fbf8f4" stroke="#7a6e66" stroke-width="1.5"></path>
<path d="M56 157 L86 180 L94 180 L124 157 Z" fill="#d6a24a" opacity="{{funilOp}}"></path>
<path d="M90 27 V{{syLine}}" stroke="#3d6fa8" stroke-width="1.5" stroke-dasharray="3 3"></path>
<path d="M86 {{arrow1}} L90 {{syLine}} L94 {{arrow1}}" fill="none" stroke="#3d6fa8" stroke-width="1.5"></path>
<rect x="95" y="{{labY}}" width="34" height="16" rx="4" fill="#ffffff" opacity="0.9"></rect>
<text x="112" y="{{labTY}}" text-anchor="middle" font-size="11" font-weight="600" fill="#3d6fa8">{{distTxt}}</text>
<path d="M134 38 H142 M134 150 H142" stroke="#7a6e66" stroke-width="1.2"></path>
<text x="145" y="42" font-size="11" fill="#7a6e66">cheio</text>
<text x="145" y="154" font-size="11" font-weight="{{vazioW}}" fill="{{vazioCor}}">vazio</text>
<rect x="84" y="182" width="12" height="10" fill="#e9e0d6" stroke="#7a6e66" stroke-width="1.2"></rect>
<rect x="52" y="186" width="22" height="14" rx="2" fill="#3a312b"></rect>
<circle cx="74" cy="194" r="3" fill="#7a6e66"></circle>
<rect x="74" y="192" width="30" height="4" rx="1.5" fill="#c4622d" transform="{{gate}}"></rect>
<g fill="#d6a24a" opacity="{{caindoOp}}">
<circle cx="90" cy="204" r="2"></circle>
<circle cx="87" cy="212" r="2"></circle>
<circle cx="93" cy="219" r="2"></circle>
</g>
<path d="M58 226 H142 L134 236 H66 Z" fill="#c08f5f"></path>
<ellipse cx="100" cy="226" rx="{{pratoRx}}" ry="3" fill="#d6a24a"></ellipse>
</svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"nivel":{"editor":"range","default":0.64,"min":0,"max":1,"step":0.01},"dist":{"editor":"float","default":9},"aberta":{"editor":"boolean","default":false},"$preview":{"width":200,"height":240}}'>
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const nivel = p.nivel === undefined ? 0.64 : p.nivel;
    const aberta = p.aberta ?? false;
    const dist = p.dist === undefined ? 9 : p.dist;
    const n = nivel === null ? 0 : Math.max(0, Math.min(1, nivel));
    const sh = Math.max(0, Math.round(n * 112));
    const sy = 150 - sh;
    const syLine = Math.max(sy, 40);
    const mid = Math.round((27 + syLine) / 2);
    return {
      sy, sh, syLine,
      arrow1: syLine - 5,
      labY: mid - 10, labTY: mid + 2,
      distTxt: dist === null ? '—' : String(dist).replace('.', ',') + ' cm',
      funilOp: n > 0 ? 1 : 0,
      vazioCor: n <= 0 ? '#c4412a' : '#7a6e66',
      vazioW: n <= 0 ? 700 : 400,
      gate: aberta ? 'rotate(70 74 194)' : 'rotate(0 74 194)',
      caindoOp: aberta && n > 0 ? 1 : 0,
      pratoRx: n > 0 ? 24 : 6,
      aria: 'Comedouro dos pais com ' + Math.round(n * 100) + '% de ração, comporta ' + (aberta ? 'aberta' : 'fechada')
    };
  }
}
</script>
</body>
</html>
